html<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>My Store</title>
    <style>
        table {
            width: 50%;
            border-collapse: collapse;
            text-align: center;
            margin: 20px auto;
        }
        th, td {
            border: 1px solid black;
            padding: 10px;
        }
        img {
            width: 100px;
            height: auto;
        }
    </style>
</head>
<body>

    <h2 style="text-align: center; font-style: italic;">My Store</h2>

    <table>
        <thead>
            <tr>
                <th>Item Photo</th>
                <th>Name</th>
                <th>Price</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td><img src="./img/cam.jpg" alt="Oranges"></td>
                <td>Oranges</td>
                <td>$1 ea.</td>
            </tr>
            <tr>
                <td><img src="./img/chuoi.jpg" alt="Bananas"></td>
                <td>Bananas</td>
                <td>$0.75/lb</td>
            </tr>
            <tr>
                <td><img src="./img/luu.jpg" alt="Pomegranates"></td>
                <td>Pomegranates</td>
                <td>3 for $5</td>
            </tr>
            <tr>
                <td><img src="./img/keo.jpg" alt="Gummy Bears"></td>
                <td>Gummy Bears</td>
                <td>$6 per bag</td>
            </tr>
            <tr>
                <td><img src="./img/lo.jpg" alt="Broccoli"></td>
                <td>Broccoli</td>
                <td>$3 a head</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
